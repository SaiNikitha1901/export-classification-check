# Scrapes every service (D5). agent-worker is discovered through Docker DNS, which returns
# one A record per replica, so `--scale agent-worker=N` is scraped without config changes.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    static_configs: [{ targets: ["api:8000"] }]
  - job_name: retriever
    static_configs: [{ targets: ["retriever:8001"] }]
  - job_name: llm-stub
    static_configs: [{ targets: ["llm-stub:8002"] }]
  - job_name: agent-worker
    dns_sd_configs:
      - names: ["agent-worker"]
        type: A
        port: 9100
        refresh_interval: 5s
  - job_name: docker-exporter
    static_configs: [{ targets: ["docker-exporter:9417"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
